<!doctype html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SIEM MVP</title>

  <!-- Tailwind (CDN for MVP) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { mono: ['JetBrains Mono', 'Fira Code', 'monospace'] },
          colors: {
            bg: '#0a0f16',
            panel: '#111826',
            neon: '#00f2ff',
            neon2: '#14f195',
            warn: '#facc15',
            err: '#ef4444'
          },
          boxShadow: {
            neon: '0 0 10px #00f2ff55',
            neon2: '0 0 10px #14f19555'
          }
        }
      }
    }
  </script>
  <!-- JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* nice thin scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 9999px; }
    .pulse-dot{
      width:10px;height:10px;border-radius:9999px;background:#14f195;
      box-shadow:0 0 0 0 #14f19577;animation:pulse 1.2s infinite;
    }
    @keyframes pulse{
      0%{transform:scale(.95);box-shadow:0 0 0 0 #14f19577}
      70%{transform:scale(1);box-shadow:0 0 0 10px transparent}
      100%{transform:scale(.95);box-shadow:0 0 0 0 transparent}
    }
    code { white-space: pre-wrap; word-break: break-word; }

    /* cyber grid background and scanlines overlay */
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      background-image:
        radial-gradient(circle at 20% 10%, #00f2ff11, transparent 30%),
        radial-gradient(circle at 80% 20%, #14f19511, transparent 30%),
        radial-gradient(circle at 50% 80%, #00f2ff0d, transparent 30%),
        linear-gradient(#ffffff05 1px, transparent 1px),
        linear-gradient(90deg, #ffffff05 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 24px 24px, 24px 24px;
      background-position: center center, center center, center center, 0 0, 0 0;
      mix-blend-mode: screen;
    }
    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.04),
        rgba(255,255,255,0.04) 1px,
        transparent 2px,
        transparent 3px
      );
      opacity:.25;mix-blend-mode:overlay;
    }

    /* neon link hover and panel glow */
    .neon-hover{transition: color .2s ease, text-shadow .2s ease;}
    .neon-hover:hover{color:#00f2ff;text-shadow:0 0 10px #00f2ff66, 0 0 20px #00f2ff44}
    .panel-glow{box-shadow:0 0 0 1px #2d37484d, 0 0 20px #00f2ff22}

    /* glitch effect for headings */
    .glitch{position:relative;display:inline-block;text-shadow:0 0 6px #00f2ff66}
    .glitch::before,.glitch::after{
      content:attr(data-text);position:absolute;inset:0;pointer-events:none;opacity:.7
    }
    .glitch::before{left:1px;text-shadow:-1px 0 #00f2ff}
    .glitch::after{left:-1px;text-shadow:1px 0 #14f195}
    @media (prefers-reduced-motion: no-preference){
      .glitch{animation:glitch-fuzz 2.2s infinite steps(12)}
      @keyframes glitch-fuzz{0%,100%{clip-path:inset(0 0 0 0)}20%{clip-path:inset(10% 0 0 0)}40%{clip-path:inset(0 0 15% 0)}60%{clip-path:inset(5% 0 5% 0)}80%{clip-path:inset(0 0 10% 0)}}
    }

    /* subtle CRT flicker on containers */
    @media (prefers-reduced-motion: no-preference){
      .crt{animation:crt-flicker 14s infinite linear}
      @keyframes crt-flicker{0%,100%{opacity:1} 50%{opacity:.98}}
    }

    /* matrix canvas sizing for crisp rendering */
    #matrix-bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
  </style>
</head>

<body class="h-full bg-bg text-gray-200 font-mono">
  <canvas id="matrix-bg"></canvas>
  <div class="relative z-10 flex h-full crt">

    <!-- Sidebar -->
    <aside class="hidden md:flex md:w-64 flex-col bg-panel/80 backdrop-blur border-r border-gray-700/40">
      <div class="px-4 py-5 border-b border-gray-700/40">
        <h1 class="glitch text-xl font-bold text-neon drop-shadow" data-text="⚡ SIEM MVP">⚡ SIEM <span class="text-neon2">MVP</span></h1>
        <p class="text-xs text-gray-400 mt-1">Offensive-grade, on-prem, no bloat.</p>
      </div>
      <nav class="flex-1 px-3 py-4 space-y-1">
        <a href="/"        class="block px-3 py-2 rounded hover:bg-gray-800/60 transition neon-hover">🏠 Dashboard</a>
        <a href="/live/"   class="block px-3 py-2 rounded hover:bg-gray-800/60 transition neon-hover">📡 Live Logs</a>
        <a href="/admin/"  class="block px-3 py-2 rounded hover:bg-gray-800/60 transition neon-hover">🛠 Admin</a>
        <!-- future -->
        <!-- <a href="/alerts/" class="block px-3 py-2 rounded hover:bg-gray-800/60 transition">🚨 Alerts</a>
        <a href="/rules/"  class="block px-3 py-2 rounded hover:bg-gray-800/60 transition">🔧 Rules</a>
        <a href="/cti/"    class="block px-3 py-2 rounded hover:bg-gray-800/60 transition">🧠 CTI</a> -->
      </nav>
      <div class="p-4 text-xs text-gray-500 border-t border-gray-700/40">
        v0.1 • Built with Django + Channels
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto">
      <header class="md:hidden flex items-center justify-between p-3 border-b border-gray-700/40 bg-panel/80 sticky top-0 z-50 panel-glow">
        <h1 class="glitch text-lg font-bold text-neon" data-text="SIEM MVP">SIEM MVP</h1>
        <a href="/live/" class="text-sm px-2 py-1 rounded bg-neon/10 hover:bg-neon/20 border border-neon/40 text-neon neon-hover">Live</a>
      </header>

      <div class="p-4 md:p-6 panel-glow rounded">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  <script>
    (function(){
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced) return;
      const canvas = document.getElementById('matrix-bg');
      const ctx = canvas.getContext('2d');
      let width, height, columns, drops, deviceScale;

      function resize(){
        deviceScale = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.floor(window.innerWidth);
        height = Math.floor(window.innerHeight);
        canvas.width = Math.floor(width * deviceScale);
        canvas.height = Math.floor(height * deviceScale);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);
        const fontSize = 14;
        columns = Math.ceil(width / fontSize);
        drops = new Array(columns).fill(1);
        ctx.font = fontSize + 'px JetBrains Mono, monospace';
      }

      const glyphs = 'アカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%*+-;:'.split('');
      function draw(){
        ctx.fillStyle = 'rgba(10,15,22,0.18)';
        ctx.fillRect(0,0,width,height);
        for (let i=0;i<drops.length;i++){
          const text = glyphs[Math.floor(Math.random()*glyphs.length)];
          const x = i * 14;
          const y = drops[i] * 14;
          ctx.fillStyle = Math.random() > 0.975 ? '#00f2ff' : '#14f195';
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 8;
          ctx.fillText(text, x, y);
          if (y > height && Math.random() > 0.975){ drops[i] = 0; }
          drops[i]++;
        }
        ctx.shadowBlur = 0;
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
